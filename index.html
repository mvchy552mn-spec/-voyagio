<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cîmes — Partagez vos sommets</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#181F1C;--ink-2:#212A25;--paper:#F5F2EA;--fog:#96A199;--rust:#D9852E;--glacier:#7FA3B5;--green:#5C7A63;--line:rgba(245,242,234,.13)}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:Inter,sans-serif;line-height:1.5;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Fraunces,serif;font-weight:500;margin:0}
a{color:inherit;text-decoration:none}button,input,select,textarea{font-family:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:2000;background:rgba(24,31,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 0}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:Fraunces,serif;font-size:1.25rem;color:var(--paper)}.logo b{color:var(--rust)}
.links{display:flex;gap:22px;font-size:.92rem;color:var(--fog)}.links a.on,.links a:hover{color:var(--paper)}
@media(max-width:800px){.links{display:none}}
.btn{display:inline-block;padding:10px 20px;border-radius:3px;font-size:.9rem;font-weight:500;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--paper)}
.btn.rust{background:var(--rust);color:var(--ink);border-color:var(--rust)}.btn.sm{padding:6px 12px;font-size:.8rem}
.section{padding:34px 0;animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:20px}.sh p{color:var(--fog);margin:0;font-size:.9rem}
.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}@media(max-width:900px){.feed{grid-template-columns:1fr}}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer;transition:transform .15s}.card:hover{transform:translateY(-3px)}
.art{position:relative;aspect-ratio:4/3;background-size:cover;background-position:center}
.art .ba{position:absolute;top:10px;left:10px;background:rgba(24,31,28,.75);border:1px solid var(--line);padding:3px 9px;font-family:Fraunces,serif;font-size:.8rem}
.art .demo{position:absolute;top:10px;right:10px;background:var(--glacier);color:var(--ink);font-size:.68rem;padding:2px 7px;border-radius:2px}
.cb{padding:14px 16px}.cb h3{font-size:1.05rem;margin-bottom:4px}
.meta{display:flex;gap:12px;color:var(--fog);font-size:.82rem;flex-wrap:wrap}.meta b{color:var(--paper);font-weight:500}
.soc{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:.8rem;color:var(--fog)}
.lk{background:none;border:none;color:var(--fog);cursor:pointer;font-size:.85rem}.lk.on{color:var(--rust)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:16px 0 28px}
.strip.five{grid-template-columns:repeat(5,1fr)}@media(max-width:700px){.strip,.strip.five{grid-template-columns:repeat(2,1fr)}}
.sp{background:var(--ink-2);padding:14px}.sp b{display:block;font-family:Fraunces,serif;font-size:1.35rem}.sp span{color:var(--fog);font-size:.76rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 14px;border:1px solid var(--line);border-radius:20px;font-size:.8rem;color:var(--fog);background:var(--ink-2);cursor:pointer}.chip.on{background:var(--glacier);color:var(--ink);border-color:var(--glacier)}
input,select,textarea{width:100%;background:var(--ink-2);color:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:.92rem}
label{display:block;font-size:.78rem;color:var(--fog);margin:12px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:600px){.grid3{grid-template-columns:1fr 1fr}}
.map{height:380px;border:1px solid var(--line);border-radius:6px;background:var(--ink-2)}
.notice{background:var(--ink-2);border:1px dashed var(--rust);border-radius:6px;padding:14px;color:var(--fog);font-size:.88rem}
.err{background:rgba(217,133,46,.15);border:1px solid var(--rust);border-radius:4px;padding:10px 12px;margin:10px 0;font-size:.88rem}
.empty{text-align:center;color:var(--fog);padding:40px 10px;border:1px dashed var(--line);border-radius:6px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}@media(max-width:700px){.gal{grid-template-columns:repeat(2,1fr)}}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;cursor:pointer;display:block}
.cover{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:16/7;background:#33413A center/cover;margin-bottom:20px}
.cover h2{position:absolute;bottom:16px;left:20px;right:20px;font-size:clamp(1.4rem,3.5vw,2.1rem);text-shadow:0 2px 12px #000}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(15,18,16,.85))}.cover h2{z-index:1}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.prof{width:100%;height:160px;background:var(--ink-2);border:1px solid var(--line);border-radius:6px;touch-action:none;display:block}
.ro{color:var(--fog);font-size:.82rem;margin:6px 0 16px;min-height:1.4em}
.cm{padding:10px 0;border-top:1px solid var(--line);font-size:.9rem;display:flex;justify-content:space-between;gap:10px}.cm small{color:var(--fog)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.badge{background:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:14px 8px;text-align:center;font-size:.76rem;color:var(--fog)}.badge.on{color:var(--paper);border-color:var(--rust)}
.badge i{font-style:normal;font-size:1.6rem;display:block}.badge:not(.on) i{filter:grayscale(1);opacity:.35}
.tl{border-left:2px solid var(--rust);margin:14px 0 14px 8px;padding-left:16px;font-size:.88rem;color:var(--fog)}.tl div{margin:8px 0}.tl b{color:var(--paper)}
.ov{position:fixed;inset:0;background:rgba(10,13,11,.92);display:none;align-items:center;justify-content:center;z-index:3000;padding:16px}.ov.on{display:flex}
.ov img{max-width:100%;max-height:80vh;border-radius:4px}.ov .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px}
.m3{width:min(640px,100%);aspect-ratio:4/3;background:#0F1512;border-radius:6px;cursor:grab;touch-action:none}
.bn{position:fixed;bottom:0;left:0;right:0;z-index:2000;display:none;background:rgba(24,31,28,.96);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.bn div{display:flex;justify-content:space-around}.bn a{color:var(--fog);font-size:.68rem;text-align:center}.bn a.on{color:var(--paper)}
.bn a.plus{background:var(--rust);color:var(--ink);width:44px;height:44px;border-radius:50%;font-size:1.4rem;line-height:44px;margin-top:-16px}
@media(max-width:800px){.bn{display:block}}
.pv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pv div{position:relative}.pv img{width:80px;height:80px;object-fit:cover;border-radius:4px}
.pv button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer}
.sug{position:relative}.sugl{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--ink-2);border:1px solid var(--line);border-radius:6px;z-index:50;max-height:320px;overflow:auto;display:none}
.sugl.on{display:block}.sugi{padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid var(--line);font-size:.88rem}.sugi:hover{background:var(--ink)}.sugi:last-child{border:none}
.sugi span.tp{margin-left:auto;color:var(--fog);font-size:.74rem}
</style>
</head>
<body>
<header><nav class="wrap"><a href="#/" class="logo">Cîmes<b>▲</b></a>
<div class="links" id="links"></div>
<a href="#/creer" class="btn rust sm">+ Créer une ascension</a></nav></header>
<main class="wrap" id="app"></main>
<div class="bn"><div><a href="#/">🏠<br>Accueil</a><a href="#/explorer">🧭<br>Explorer</a><a href="#/creer" class="plus">+</a><a href="#/carte">🗺️<br>Carte</a><a href="#/profil">👤<br>Profil</a></div></div>
<div class="ov" id="ov"><button class="btn sm x" id="ovx">✕</button><div id="ovc"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============ Utils ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:d});
const ME={id:'lea',name:'Léa Fontaine',handle:'@lea.fontaine'}; // remplaçable par un vrai compte (phase 2)
const LIMITS={gpx:15*1024*1024,photo:12*1024*1024};
let PENDING=null; // relai ponctuel entre l'enregistrement GPS / la recherche d'itinéraire et le formulaire de création

/* ============ Data layer (repository — swappable for Supabase) ============ */
const repo=(()=>{
 let db;
 const open=()=>db?Promise.resolve(db):new Promise((res,rej)=>{const r=indexedDB.open('cimes',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('asc',{keyPath:'id'});
  r.onsuccess=()=>res(db=r.result);r.onerror=()=>rej(r.error)});
 const tx=(m,f)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction('asc',m);const q=f(t.objectStore('asc'));t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)}));
 return{all:()=>tx('readonly',s=>s.getAll()),get:id=>tx('readonly',s=>s.get(id)),save:a=>tx('readwrite',s=>s.put(a)),remove:id=>tx('readwrite',s=>s.delete(id))};
})();
const DEMO=[
 {id:'d1',name:'Croix de Belledonne',alt:1900,dist:7.4,dplus:780,user:'Julien R.',massif:'Belledonne',region:'Alpes',type:'Randonnée',date:'2026-09-23',likes:24,g:['#8FB4C4','#3E5A63']},
 {id:'d2',name:'Pointe de la Grande Journée',alt:2534,dist:14.2,dplus:1340,user:'Léa Fontaine',uid:'lea',massif:'Belledonne',region:'Alpes',type:'Trail',date:'2026-09-25',likes:42,g:['#D9C7A8','#A65A2E']},
 {id:'d3',name:'Roc du Vent',alt:2210,dist:11,dplus:980,user:'Amina T.',massif:'Chartreuse',region:'Alpes',type:'Randonnée',date:'2026-09-21',likes:17,g:['#B9C79A','#5C7A63']},
 {id:'d4',name:'Aiguille de la Combe',alt:2890,dist:9.6,dplus:1120,user:'Marc D.',massif:'Vanoise',region:'Alpes',type:'Alpinisme',date:'2026-09-20',likes:31,g:['#C7B7D9','#5B4E73']}
].map(d=>({...d,demo:true,photos:[],comments:[],track:null,likedBy:[],savedBy:[],description:'Ascension de démonstration.'}));
async function load(){let a=await repo.all();
 if(!localStorage.cimesSeeded){for(const d of DEMO)await repo.save(d);localStorage.cimesSeeded='1';a=await repo.all()}
 return a.sort((x,y)=>(y.date||'').localeCompare(x.date||''))}

/* ============ Geo / GPX ============ */
const R=6371000,rad=x=>x*Math.PI/180;
const hav=(a,b)=>{const dl=rad(b.lat-a.lat),dn=rad(b.lon-a.lon);const h=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function computeStats(pts){
 let dist=0,up=0,dn=0,min=Infinity,max=-Infinity,ref=null;const cum=[0];
 pts.forEach((p,i)=>{if(i)cum.push(dist+=hav(pts[i-1],p));
  if(p.ele!=null){min=Math.min(min,p.ele);max=Math.max(max,p.ele);
   if(ref==null)ref=p.ele;const d=p.ele-ref;
   if(d>=3){up+=d;ref=p.ele}else if(d<=-3){dn-=d;ref=p.ele}}}); // seuil 3 m anti-bruit GPS
 const t0=pts.find(p=>p.t)?.t,t1=[...pts].reverse().find(p=>p.t)?.t;
 return{dist:dist/1000,dplus:Math.round(up),dminus:Math.round(dn),min:isFinite(min)?Math.round(min):null,max:isFinite(max)?Math.round(max):null,
  duration:t0&&t1?Math.round((t1-t0)/60000):null,cum,start:t0||null,startHour:t0?new Date(t0).getHours():null};
}
function parseGPX(text){
 const x=new DOMParser().parseFromString(text,'application/xml');
 if(x.querySelector('parsererror'))throw new Error('Fichier XML invalide.');
 const nodes=[...x.getElementsByTagName('trkpt')];
 if(nodes.length<2)throw new Error('Aucun point de trace (trkpt) trouvé dans ce GPX.');
 const pts=nodes.map(n=>{const e=n.getElementsByTagName('ele')[0],t=n.getElementsByTagName('time')[0];
  return{lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon'),ele:e?+e.textContent:null,t:t?Date.parse(t.textContent):null}})
  .filter(p=>isFinite(p.lat)&&isFinite(p.lon));
 if(pts.length<2)throw new Error('Coordonnées GPS invalides.');
 return pts;
}
const buildGPX=a=>{const pts=(a.track||[]).map(p=>`<trkpt lat="${p.lat}" lon="${p.lon}">${p.ele!=null?`<ele>${p.ele}</ele>`:''}${p.t?`<time>${new Date(p.t).toISOString()}</time>`:''}</trkpt>`).join('');
 return`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Cîmes" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>${esc(a.name)}</name><trkseg>${pts}</trkseg></trk></gpx>`};
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function downloadGPX(a){if(!a.track){toast('Cette ascension n’a pas de trace GPX à exporter.');return}
 const u=URL.createObjectURL(new Blob([buildGPX(a)],{type:'application/gpx+xml'}));const l=document.createElement('a');l.href=u;l.download=`cimes-${slug(a.name)}.gpx`;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const simplify=(pts,n=600)=>pts.length<=n?pts:pts.filter((_,i)=>i%Math.ceil(pts.length/n)===0||i===pts.length-1);

/* ============ Photos ============ */
function readExifGPS(buf){ // lecture EXIF minimale : GPS + date de prise de vue
 try{const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;let off=2;
 while(off<v.byteLength-4){
  if(v.getUint8(off)!==0xFF)break;const marker=v.getUint8(off+1);
  if(marker===0xE1){const start=off+4;if(v.getUint32(start)!==0x45786966)return null;
   const tiff=start+6,little=v.getUint16(tiff)===0x4949,g16=o=>v.getUint16(o,little),g32=o=>v.getUint32(o,little),gs32=o=>v.getInt32(o,little);
   const ifd0=tiff+g32(tiff+4),entries=g16(ifd0);let gpsOff=null,dateStr=null;
   for(let i=0;i<entries;i++){const e=ifd0+2+i*12,tag=g16(e);
    if(tag===0x8825)gpsOff=tiff+g32(e+8);
    if(tag===0x0132){const cnt=g32(e+4);let vo=cnt>4?tiff+g32(e+8):e+8,s='';for(let k=0;k<cnt-1;k++)s+=String.fromCharCode(v.getUint8(vo+k));dateStr=s}}
   let lat=null,lon=null,alt=null;
   if(gpsOff){const gn=g16(gpsOff),rat=o=>{const n=gs32(o),d=gs32(o+4);return d?n/d:0};let latRef='N',lonRef='E',la=null,lo=null;
    for(let i=0;i<gn;i++){const e=gpsOff+2+i*12,tag=g16(e);
     if(tag===1)latRef=String.fromCharCode(v.getUint8(e+8));if(tag===3)lonRef=String.fromCharCode(v.getUint8(e+8));
     if(tag===2){const o=tiff+g32(e+8);la=rat(o)+rat(o+8)/60+rat(o+16)/3600}
     if(tag===4){const o=tiff+g32(e+8);lo=rat(o)+rat(o+8)/60+rat(o+16)/3600}
     if(tag===6){const o=tiff+g32(e+8);alt=rat(o)}}
    if(la!=null)lat=latRef==='S'?-la:la;if(lo!=null)lon=lonRef==='W'?-lo:lo}
   return{lat,lon,alt,date:dateStr}}
  if(marker===0xD8||(marker>=0xD0&&marker<=0xD9))off+=2;else off+=2+v.getUint16(off+2)}
 return null}catch{return null}}
function readPhoto(file){return new Promise(async(res,rej)=>{
 if(!/^image\/(jpeg|png|webp)$/.test(file.type))return rej(new Error(`${file.name} : format non supporté (JPEG, PNG, WebP).`));
 if(file.size>LIMITS.photo)return rej(new Error(`${file.name} : fichier trop volumineux (max 12 Mo).`));
 let exif=null;if(file.type==='image/jpeg'){try{exif=readExifGPS(await file.slice(0,131072).arrayBuffer())}catch{}}
 const img=new Image(),u=URL.createObjectURL(file);
 img.onerror=()=>rej(new Error(`${file.name} : photo illisible.`));
 img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
  res({id:crypto.randomUUID(),name:file.name,src:c.toDataURL('image/jpeg',.82),lat:exif?.lat??null,lon:exif?.lon??null,ele:exif?.alt??null,date:exif?.date||null,manual:false})};
 img.src=u})}
function photoDist(a,p){if(!a.track||p.lat==null||!a.cum)return null;let best=0,bd=Infinity;
 a.track.forEach((q,i)=>{const d=hav(q,{lat:p.lat,lon:p.lon});if(d<bd){bd=d;best=i}});return a.cum[best]}
function openPositionModal(track,current,onPick){
 openOv(`<h3 style="margin-bottom:10px">Positionner la photo</h3><div class="map" id="pmap" style="height:320px"></div><p class="ro">Clique sur le tracé à l’endroit où la photo a été prise, puis valide.</p><button class="btn rust" id="pmok">Valider</button>`);
 const m=makeMap($('#pmap'));if(!m)return;
 const ll=simplify(track).map(p=>[p.lat,p.lon]);const pl=L.polyline(ll,{color:'#D9852E',weight:4}).addTo(m);m.fitBounds(pl.getBounds(),{padding:[20,20]});
 let chosen=current&&current.lat!=null?current:null;
 let mk=chosen?L.circleMarker([chosen.lat,chosen.lon],{radius:8,color:'#fff',fillColor:'#D9852E',fillOpacity:1}).addTo(m):null;
 m.on('click',e=>{let best=null,bd=Infinity;track.forEach(p=>{const d=hav(p,{lat:e.latlng.lat,lon:e.latlng.lng});if(d<bd){bd=d;best=p}});
  chosen=best;if(mk)mk.setLatLng([best.lat,best.lon]);else mk=L.circleMarker([best.lat,best.lon],{radius:8,color:'#fff',fillColor:'#D9852E',fillOpacity:1}).addTo(m)});
 $('#pmok').onclick=()=>{if(!chosen)return toast('Clique d’abord sur le tracé.');onPick(chosen);closeOv()}}

/* ============ Badges & stats ============ */
const mine=l=>l.filter(a=>a.uid===ME.id||a.user===ME.name);
function totals(l){const t={n:l.length,dist:0,dplus:0,dminus:0,alt:0,time:0,photos:0,night:false};
 l.forEach(a=>{t.dist+=a.dist||0;t.dplus+=a.dplus||0;t.dminus+=a.dminus||0;t.alt=Math.max(t.alt,a.alt||0);t.time+=a.duration||0;t.photos+=(a.photos||[]).length;
  if(a.startHour!=null&&(a.startHour>=21||a.startHour<5))t.night=true});
 t.peaks=new Set(l.map(a=>a.name.toLowerCase())).size;return t}
const BADGES=[['🥾','Première ascension',t=>t.n>=1],['🔥','5 sorties',t=>t.n>=5],['🏔️','10 sommets',t=>t.peaks>=10],['🗻','Premier 3 000 m',t=>t.alt>=3000],['🗻','Premier 4 000 m',t=>t.alt>=4000],
 ['🏃','100 km',t=>t.dist>=100],['⛰️','10 000 m D+',t=>t.dplus>=10000],['📸','Photo ajoutée',t=>t.photos>=1],['🌙','Sortie nocturne',t=>t.night]];

/* ============ UI helpers ============ */
const app=$('#app');let L_all=[],mapInst=null,cleanup=null,activeWatch=null;
function toast(m){const d=document.createElement('div');d.className='err';d.style.cssText='position:fixed;bottom:90px;left:20px;right:20px;z-index:4000;max-width:420px;margin:auto';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
const cover=a=>a.photos?.[0]?`background-image:url('${a.photos[0].src}')`:`background:linear-gradient(${a.g?.[0]||'#8FB4C4'},${a.g?.[1]||'#3E5A63'})`;
function card(a){const liked=a.likedBy.includes(ME.id);

/* ============ Elevation profile ============ */
function profile(el,a,m){
 const pts=a.track,cum=a.cum;if(!pts||!pts.some(p=>p.ele!=null)){el.innerHTML='<div class="empty">Pas de données d’altitude dans ce GPX.</div>';return}
 const W=900,H=160,S=simplify(pts.map((p,i)=>({...p,d:cum[i]})),500).filter(p=>p.ele!=null);
 const lo=Math.min(...S.map(p=>p.ele)),hi=Math.max(...S.map(p=>p.ele)),D=S.at(-1).d||1;
 const X=d=>d/D*W,Y=e=>H-10-(e-lo)/((hi-lo)||1)*(H-30);
 const line=S.map((p,i)=>`${i?'L':'M'}${X(p.d).toFixed(1)},${Y(p.ele).toFixed(1)}`).join('');
 el.innerHTML=`<svg class="prof" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${line}L${W},${H}L0,${H}Z" fill="rgba(127,163,181,.2)"/><path d="${line}" fill="none" stroke="#7FA3B5" stroke-width="2" vector-effect="non-scaling-stroke"/><line id="cur" y1="0" y2="${H}" stroke="#D9852E" stroke-width="1.5" vector-effect="non-scaling-stroke" style="display:none"/></svg><div class="ro" id="ro">Glisse sur le graphique · ${fmt(lo)}–${fmt(hi)} m</div>`;
 const svg=$('svg',el),cur=$('#cur',el),ro=$('#ro',el);let mk=null;
 const move=e=>{const r=svg.getBoundingClientRect();const f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));const d=f*D;
  const p=S.reduce((b,q)=>Math.abs(q.d-d)<Math.abs(b.d-d)?q:b);cur.setAttribute('x1',X(p.d));cur.setAttribute('x2',X(p.d));cur.style.display='';
  ro.textContent=`${fmt(p.ele)} m · ${fmt(p.d/1000,2)} km`;
  if(m){if(!mk)mk=L.circleMarker([p.lat,p.lon],{radius:7,color:'#fff',fillColor:'#D9852E',fillOpacity:1}).addTo(m);else mk.setLatLng([p.lat,p.lon])}};
 svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move)}

function loadMapLibre(){ // chargé une seule fois, à la demande, pour ne pas alourdir chaque page
 if(window.maplibregl)return Promise.resolve();
 if(maplibreLoading)return maplibreLoading;
 return maplibreLoading=new Promise((res,rej)=>{
  const link=document.createElement('link');link.rel='stylesheet';link.href='https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.12.0/maplibre-gl.min.css';document.head.appendChild(link);
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.12.0/maplibre-gl.min.js';
  s.onload=res;s.onerror=()=>rej(new Error('Chargement du moteur 3D impossible (réseau).'));document.head.appendChild(s);

async function open3D(a){

 toast('Chargement de la vue 3D…');
 try{await loadMapLibre()}catch(x){toast(x.message);return}
 openOv(`<h3 style="margin-bottom:10px">Vue 3D — relief réel — ${esc(a.name)}</h3><div class="m3" id="m3" style="aspect-ratio:16/10"></div>
 <p class="ro">Glisser pour tourner (clic droit) · molette pour zoomer · glisser (clic gauche) pour déplacer. Élévation réelle (données ouvertes, exagération ×1,4).</p>
 <button class="btn sm" id="rc">Survoler le tracé</button>`);
 const pts=simplify(a.track,300);
 const line={type:'Feature',geometry:{type:'LineString',coordinates:pts.map(p=>[p.lon,p.lat])}};
 const start=pts[0],end=pts.at(-1);
 const m=new maplibregl.Map({
  container:$('#m3'),
  style:{version:8,
   sources:{
    osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'},
    terrain:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,encoding:'terrarium',maxzoom:15}
   },
   layers:[{id:'osm',type:'raster',source:'osm'}],
   terrain:{source:'terrain',exaggeration:1.4}
  },
  center:[start.lon,start.lat],zoom:12,pitch:65,bearing:0,maxPitch:85,antialias:true
 });
 m3d=m;
 m.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
 m.on('load',()=>{
  m.addSource('trace',{type:'geojson',data:line});
  m.addLayer({id:'trace-line',type:'line',source:'trace',paint:{'line-color':'#D9852E','line-width':4}});
  m.addSource('pts',{type:'geojson',data:{type:'FeatureCollection',features:[
   {type:'Feature',geometry:{type:'Point',coordinates:[start.lon,start.lat]},properties:{c:'#7FA3B5'}},
   {type:'Feature',geometry:{type:'Point',coordinates:[end.lon,end.lat]},properties:{c:'#F5F2EA'}}]}});
  m.addLayer({id:'trace-pts',type:'circle',source:'pts',paint:{'circle-radius':6,'circle-color':['get','c'],'circle-stroke-width':2,'circle-stroke-color':'#181F1C'}});
  const b=new maplibregl.LngLatBounds();pts.forEach(p=>b.extend([p.lon,p.lat]));m.fitBounds(b,{padding:60,pitch:65,duration:0});
 });
 m.on('error',e=>{if(!m._warned){m._warned=true;toast('Le relief réel n’a pas pu se charger (réseau/CORS). Nouvelle tentative possible en rouvrant la vue 3D.')}});
 $('#rc').onclick=()=>{
  if(!m3d)return;const dur=pts.length*60;let i=0;
  const step=()=>{if(!m3d||i>=pts.length)return;const p=pts[i];m3d.easeTo({center:[p.lon,p.lat],pitch:68,bearing:(i/pts.length)*40-20,duration:70,easing:x=>x});i+=Math.max(1,Math.round(pts.length/120));if(i<pts.length)setTimeout(step,70)};
  step();};
}

/* ============ Recherche d'itinéraires (données géographiques réelles — OpenStreetMap/Overpass) ============ */
/* Couvre sommets, randonnées balisées, via ferratas et pistes de ski. Coordonnées et tracés réels, jamais inventés. */
const ROUTE_TYPES={
 peak:{label:'Sommet',icon:'🏔️'},
 hiking:{label:'Randonnée pédestre',icon:'🥾'},
 mtb:{label:'VTT',icon:'🚵'},
 horse:{label:'Équestre',icon:'🐴'},
 via_ferrata:{label:'Via ferrata',icon:'🧗'},
 climbing:{label:'Escalade',icon:'🧗‍♀️'},
 piste_alpine:{label:'Piste de ski alpin',icon:'⛷️'},
 piste_nordic:{label:'Ski nordique / fond',icon:'🎿'},
 piste_touring:{label:'Ski de randonnée',icon:'🏔️'},
 piste_sled:{label:'Piste de luge',icon:'🛷'},
 piste_hike:{label:'Sentier raquettes',icon:'🥾❄️'},
 refuge:{label:'Refuge / cabane',icon:'🛖'},
 lake:{label:'Lac',icon:'💧'}
};
const PISTE_KIND={downhill:'piste_alpine',nordic:'piste_nordic',skitour:'piste_touring',sled:'piste_sled',hike:'piste_hike',sleigh:'piste_sled',connection:'piste_alpine',ski_touring:'piste_touring'};
const PISTE_DIFF={novice:'verte',easy:'bleue',intermediate:'rouge',advanced:'noire',expert:'noire',freeride:'hors-piste'};
/* Zone de recherche : France métropolitaine + Corse (sud,ouest,nord,est). Sans cette limite, Overpass scanne toute la planète
   sur une quinzaine de types de tags à la fois et dépasse systématiquement le timeout -> résultats vides, même pour "Mont Blanc". */
const SEARCH_BBOX='41.2,-5.2,51.2,9.7';
/* Le serveur public overpass-api.de est parfois saturé/lent : on essaie plusieurs miroirs équivalents (mêmes données OSM) avec un délai limité,
   et on bascule sur le suivant plutôt que de renvoyer un échec sec. */
const OVERPASS_MIRRORS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.osm.ch/api/interpreter'];
async function fetchOverpass(query){
 let lastErr=null;
 for(const base of OVERPASS_MIRRORS){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),12000);
  try{
   const r=await fetch(base,{method:'POST',body:'data='+encodeURIComponent(query),signal:ctrl.signal});
   clearTimeout(t);
   if(!r.ok){lastErr=new Error('code '+r.status);continue}
   return await r.json();
  }catch(x){clearTimeout(t);lastErr=x.name==='AbortError'?new Error('délai dépassé'):x}
 }
 throw new Error('Tous les serveurs de recherche sont indisponibles pour le moment ('+(lastErr?.message||'?')+'). Réessaie dans quelques instants.');
}
async function searchRoutes(q){
 const n=q.replace(/["\\]/g,'');
 const query=`[out:json][timeout:25][bbox:${SEARCH_BBOX}];(
  nwr["natural"~"^(peak|water)$"]["name"~"${n}",i];
  nwr["route"~"^(hiking|foot|mtb|horse|via_ferrata)$"]["name"~"${n}",i];
  nwr["via_ferrata_scale"]["name"~"${n}",i];
  nwr["sport"="climbing"]["name"~"${n}",i];
  nwr["piste:type"]["name"~"${n}",i];
  nwr["tourism"~"^(alpine_hut|wilderness_hut)$"]["name"~"${n}",i];
 );out geom 40;`;
 const j=await fetchOverpass(query);
 const seen=new Set();
 return (j.elements||[]).map(e=>{
  const tg=e.tags||{};let kind='hiking',extra='';
  if(tg.natural==='peak')kind='peak';
  else if(tg.natural==='water')kind='lake';
  else if(tg.tourism==='alpine_hut'||tg.tourism==='wilderness_hut')kind='refuge';
  else if(tg.sport==='climbing')kind='climbing';
  else if(tg['piste:type']){kind=PISTE_KIND[tg['piste:type']]||'piste_alpine';if(tg['piste:difficulty'])extra=PISTE_DIFF[tg['piste:difficulty']]?'difficulté '+PISTE_DIFF[tg['piste:difficulty']]:tg['piste:difficulty']}
  else if(tg.via_ferrata_scale||tg.route==='via_ferrata'){kind='via_ferrata';if(tg.via_ferrata_scale)extra='cotation '+tg.via_ferrata_scale}
  else if(tg.route==='mtb')kind='mtb';
  else if(tg.route==='horse')kind='horse';
  else if(tg.route==='hiking'||tg.route==='foot'){kind='hiking';if(tg.sac_scale)extra=tg.sac_scale}
  let lat,lon,track=null;
  if(e.type==='node'){lat=e.lat;lon=e.lon}
  else if(e.type==='way'&&e.geometry&&e.geometry.length){
   const pts=e.geometry.filter(g=>g).map(g=>({lat:g.lat,lon:g.lon,ele:null}));if(!pts.length)return null;
   lat=pts[0].lat;lon=pts[0].lon;if(kind!=='lake')track=simplify(pts,350); // pour un lac, le contour n'est pas un itinéraire : on garde juste la position
  }
  else if(e.type==='relation'&&e.members){ // itinéraire réel : assemblage des tronçons de la relation OSM, comme un tracé Visorando
   const pts=(e.members||[]).filter(m=>m.type==='way'&&m.geometry&&m.geometry.length).flatMap(m=>m.geometry.map(g=>({lat:g.lat,lon:g.lon,ele:null})));
   if(!pts.length)return null;lat=pts[0].lat;lon=pts[0].lon;if(kind!=='lake')track=simplify(pts,350);
  }
  else return null;
  const dist=track&&track.length>1?computeStats(track).dist:null;
  return{key:e.type+e.id,name:tg.name||'Sans nom',kind,lat,lon,ele:tg.ele?Math.round(+tg.ele):null,track,extra,dist};
 }).filter(x=>x&&!seen.has(x.key)&&seen.add(x.key));
}
function routeDetail(res){
 const t=ROUTE_TYPES[res.kind];
 const matches=L_all.filter(a=>{const an=a.name.toLowerCase(),rn=res.name.toLowerCase();return an===rn||an.includes(rn)||rn.includes(an)});
 const photos=matches.flatMap(a=>(a.photos||[]).map(p=>({...p,user:a.user})));
 openOv(`<h3 style="margin-bottom:6px">${t.icon} ${esc(res.name)}</h3><div class="ro">${t.label}${res.ele?' · '+fmt(res.ele)+' m':''}${res.extra?' · '+esc(res.extra):''} · ${res.lat.toFixed(4)}, ${res.lon.toFixed(4)}</div>
 ${res.track?`<div class="strip" style="margin:0 0 14px"><div class="sp"><b>${fmt(res.dist,1)} km</b><span>distance du tracé</span></div><div class="sp"><b>≈ ${(()=>{const mn=Math.round(res.dist/4*60);return mn>=60?Math.floor(mn/60)+' h '+String(mn%60).padStart(2,'0'):mn+' min'})()}</b><span>durée estimée (4 km/h)</span></div></div><div class="map" id="rdmap" style="height:280px;margin-bottom:14px"></div>`:'<div class="notice" style="margin-bottom:14px">Pas de tracé OSM disponible pour cet élément — seule la position est connue.</div>'}
 <div class="acts"><button class="btn rust sm" id="usehere">Créer mon ascension ici</button></div>
 <div class="sh" style="margin-top:10px"><h3 style="font-size:1rem">Déjà parcouru par la communauté</h3><p>${matches.length} ascension(s)</p></div>
 ${photos.length?`<div class="gal">${photos.slice(0,12).map(p=>`<img src="${p.src}" alt="" title="${esc(p.user)}">`).join('')}</div>`:''}
 ${matches.length?matches.map(a=>`<div class="cm"><a href="#/ascension/${esc(a.id)}" id="mgo${esc(a.id)}">${esc(a.name)} — ${esc(a.user)}</a><small>${esc(a.date)}</small></div>`).join(''):'<div class="empty">Personne n’a encore publié d’ascension sur cet itinéraire. Sois le·la premier·ère !</div>'}`);
 if(res.track){const m=makeMap($('#rdmap'));if(m){const ll=res.track.map(p=>[p.lat,p.lon]);const pl=L.polyline(ll,{color:'#7FA3B5',weight:4}).addTo(m);m.fitBounds(pl.getBounds(),{padding:[16,16]})}}
 $('#usehere').onclick=()=>{PENDING={summit:{name:res.name,lat:res.lat,lon:res.lon,ele:res.ele},track:res.track};closeOv();location.hash='#/creer'};
 matches.forEach(a=>{const el=$('#mgo'+a.id);if(el)el.onclick=e=>{e.preventDefault();closeOv();location.hash='#/ascension/'+a.id}});
}
function bindRouteSearch(inputSel,listSel){
 const inp=$(inputSel),list=$(listSel);let timer=null;
 inp.oninput=()=>{clearTimeout(timer);const q=inp.value.trim();if(q.length<3){list.classList.remove('on');list.innerHTML='';return}
  timer=setTimeout(async()=>{list.innerHTML='<div class="sugi">Recherche…</div>';list.classList.add('on');
   try{const res=await searchRoutes(q);
    list.innerHTML=res.length?res.map((r,i)=>{const t=ROUTE_TYPES[r.kind];return `<div class="sugi" data-i="${i}"><span>${t.icon}</span><span>${esc(r.name)}${r.ele?' · '+fmt(r.ele)+' m':''}${r.dist?' · '+fmt(r.dist,1)+' km':''}${r.extra?' · '+esc(r.extra):''}</span><span class="tp">${t.label}</span></div>`}).join(''):'<div class="sugi">Aucun résultat pour cette recherche.</div>';
    list.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{routeDetail(res[+el.dataset.i]);list.classList.remove('on');inp.value=res[+el.dataset.i].name});
   }catch(x){list.innerHTML=`<div class="sugi">Recherche indisponible : ${esc(x.message)}.</div>`}
  },550)};
 document.addEventListener('click',e=>{if(!inp.contains(e.target)&&!list.contains(e.target))list.classList.remove('on')});
}

  l=l.sort((x,y)=>f.sort==='date'?(y.date||'').localeCompare(x.date||''):(y[f.sort]||0)-(x[f.sort]||0));$('#res').innerHTML=grid(l,'Aucun résultat pour ces critères.');bindCards($('#res'))};
 $('#ch').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;f[c.dataset.k]=f[c.dataset.k]===c.dataset.v?'':c.dataset.v;chips();draw()};
 $('#q').oninput=e=>{f.q=e.target.value;draw()};$('#alt').onchange=e=>{f.minAlt=+e.target.value;draw()};$('#so').onchange=e=>{f.sort=e.target.value;draw()};chips();draw();
 bindRouteSearch('#sq','#sl')};
views.communaute=async()=>{const users=[...new Set(L_all.map(a=>a.user))];
 app.innerHTML=`<div class="section"><div class="sh"><h2>Communauté</h2><p>${users.length} randonneurs actifs</p></div>
 ${users.map(u=>{const t=totals(L_all.filter(a=>a.user===u));return`<div class="card" style="cursor:default;padding:14px;margin-bottom:10px"><b>${esc(u)}</b><div class="meta"><span>${t.n} ascensions</span><span>${fmt(t.dist,1)} km</span><span>+${fmt(t.dplus)} m</span><span>max ${fmt(t.alt)} m</span></div></div>`}).join('')}</div>`};
views.carte=async()=>{
 app.innerHTML=`<div class="section"><div class="sh"><h2>La carte des ascensions</h2><p>Clique sur une trace pour ouvrir la fiche</p></div><div class="map" id="map"></div>
 <p class="ro">Fonds : OpenTopoMap (relief, courbes de niveau) et OSM — sans clé. La vue 3D (fiche d’ascension) utilise une élévation réelle ouverte.</p></div>`;
 const m=makeMap($('#map'));if(!m)return;const withT=L_all.filter(a=>a.track),grp=[];
 withT.forEach(a=>{const pl=L.polyline(simplify(a.track,200).map(p=>[p.lat,p.lon]),{color:'#D9852E',weight:4}).addTo(m);grp.push(pl);
  pl.bindTooltip(`${esc(a.name)} · ${fmt(a.dist,1)} km · ${esc(a.user)}`);pl.on('click',()=>location.hash='#/ascension/'+a.id);
  (a.photos||[]).filter(p=>p.lat!=null).forEach(p=>L.marker([p.lat,p.lon],{icon:L.divIcon({html:`<div style="width:34px;height:34px;border-radius:50%;border:2px solid #D9852E;background:url('${p.src}') center/cover"></div>`,iconSize:[34,34]})}).addTo(m))});
 if(grp.length)m.fitBounds(L.featureGroup(grp).getBounds(),{padding:[30,30]});
 else $('.section').insertAdjacentHTML('beforeend','<div class="empty" style="margin-top:12px">Aucun parcours GPX publié. Importe un GPX pour voir ta trace ici. Les ascensions de démo n’ont pas de coordonnées (aucune coordonnée inventée).</div>')};
views.profil=async()=>{const l=mine(L_all),t=totals(l),tab=sessionStorage.tab||'a';
 const saved=L_all.filter(a=>a.savedBy.includes(ME.id));
 app.innerHTML=`<div class="section"><h2>${esc(ME.name)}</h2><div style="color:var(--fog)">${ME.handle} · Grenoble</div>${strip(t)}
 <div class="chips" id="tb">${[['a','Ascensions'],['s','Enregistrées'],['b','Badges'],['p','Photos'],['h','Historique'],['st','Statistiques']].map(([k,v])=>`<span class="chip ${tab===k?'on':''}" data-t="${k}">${v}</span>`).join('')}</div><div id="tp"></div></div>`;
 const months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
 const panes={a:()=>grid(l,'Aucune ascension. <br><a class="btn rust sm" href="#/creer" style="margin-top:10px">Créer ma première ascension</a>'),
  s:()=>grid(saved,'Aucune sortie enregistrée. Utilise 🔖 sur une fiche.'),
  b:()=>`<div class="badges">${BADGES.map(([e,n,f])=>`<div class="badge ${f(t)?'on':''}"><i>${e}</i>${n}</div>`).join('')}</div>`,
  p:()=>{const ph=l.flatMap(a=>(a.photos||[]).map(p=>({...p,aid:a.id})));return ph.length?`<div class="gal">${ph.map(p=>`<img src="${p.src}" alt="" data-open="${esc(p.aid)}">`).join('')}</div>`:'<div class="empty">Aucune photo publiée.</div>'},
  h:()=>l.length?months.map((m,i)=>{const x=l.filter(a=>+(a.date||'').slice(5,7)===i+1);return x.length?`<h3 style="margin:16px 0 8px">${m}</h3>${x.map(a=>`<div class="cm"><a href="#/ascension/${esc(a.id)}">${esc(a.name)}</a><small>${esc(a.date)} · ${fmt(a.dist,1)} km</small></div>`).join('')}`:''}).join(''):'<div class="empty">Aucune sortie dans l’historique.</div>',
  st:()=>`<div class="strip"><div class="sp"><b>${fmt(t.dminus)} m</b><span>D- total</span></div><div class="sp"><b>${t.peaks}</b><span>sommets</span></div><div class="sp"><b>${t.n?fmt(t.dist/t.n,1):0} km</b><span>distance moy.</span></div><div class="sp"><b>${t.n?fmt(t.dplus/t.n):0} m</b><span>D+ moyen</span></div><div class="sp"><b>${Math.floor(t.time/60)} h ${t.time%60}</b><span>temps total</span></div></div>`};
 const show=k=>{sessionStorage.tab=k;$('#tp').innerHTML=panes[k]();bindCards($('#tp'));$('#tb').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.t===k))};
 $('#tb').onclick=e=>{const c=e.target.closest('.chip');if(c)show(c.dataset.t)};show(tab)};
views.premium=async()=>{app.innerHTML=`<div class="section"><h1 style="text-align:center">Allez plus loin avec Cîmes.</h1><p style="text-align:center;color:var(--fog)">Page Premium conservée visuellement. Aucun paiement dans cette phase : toutes les fonctionnalités sont accessibles.</p></div>`};

views.enregistrer=async()=>{
 if(!navigator.geolocation){app.innerHTML='<div class="section"><div class="sh"><h2>Ma sortie</h2></div><div class="notice">GPS indisponible sur ce navigateur/appareil. Configuration requise (permission de localisation).</div></div>';return}
 app.innerHTML=`<div class="section"><div class="sh"><h2>Ma sortie</h2><p>Enregistrement GPS en direct</p></div><div id="er"></div>
 <div class="strip"><div class="sp"><b id="rt">00:00</b><span>temps</span></div><div class="sp"><b id="rd">0,0 km</b><span>distance</span></div><div class="sp"><b id="rp">+0 m</b><span>D+</span></div><div class="sp"><b id="ra">— m</b><span>altitude</span></div></div>
 <div class="map" id="rmap" style="margin-bottom:16px"></div>
 <div class="acts"><button class="btn rust" id="b0">Démarrer</button><button class="btn" id="b1" disabled>Pause</button><button class="btn" id="b2" disabled>Terminer</button></div>
 <p class="ro">Les points sont enregistrés uniquement dans ton navigateur pendant la sortie. En quittant cette page sans terminer, l’enregistrement est perdu.</p></div>`;
 const er=m=>{$('#er').innerHTML=m?`<div class="err">${esc(m)}</div>`:''};
 const rec={points:[],watchId:null,paused:false,t0:null,pausedMs:0,pauseAt:null};
 const m=makeMap($('#rmap'));let line=null,mk=null;
 const fmtT=s=>`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}`;
 const tick=()=>{if(!rec.t0)return;const el=Math.round((Date.now()-rec.t0-rec.pausedMs)/1000);$('#rt').textContent=fmtT(Math.max(0,el))};
 setInterval(tick,1000);
 const draw=()=>{if(rec.points.length<1||!m)return;const ll=rec.points.map(p=>[p.lat,p.lon]);
  if(!line)line=L.polyline(ll,{color:'#D9852E',weight:4}).addTo(m);else line.setLatLngs(ll);
  const last=rec.points.at(-1);if(!mk)mk=L.circleMarker([last.lat,last.lon],{radius:7,color:'#fff',fillColor:'#7FA3B5',fillOpacity:1}).addTo(m);else mk.setLatLng([last.lat,last.lon]);
  m.panTo([last.lat,last.lon])};
 const onPos=pos=>{if(rec.paused)return;const p={lat:pos.coords.latitude,lon:pos.coords.longitude,ele:pos.coords.altitude,t:Date.now()};rec.points.push(p);
  const s=computeStats(rec.points);$('#rd').textContent=fmt(s.dist,2)+' km';$('#rp').textContent='+'+fmt(s.dplus)+' m';$('#ra').textContent=(p.ele!=null?Math.round(p.ele):'—')+' m';draw()};
 const onErr=e=>er('GPS : '+e.message);
 $('#b0').onclick=()=>{er('');rec.t0=Date.now();rec.watchId=activeWatch=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  $('#b0').disabled=true;$('#b1').disabled=false;$('#b2').disabled=false};
 $('#b1').onclick=()=>{rec.paused=!rec.paused;$('#b1').textContent=rec.paused?'Reprendre':'Pause';
  if(rec.paused)rec.pauseAt=Date.now();else{rec.pausedMs+=Date.now()-rec.pauseAt}};
 $('#b2').onclick=()=>{navigator.geolocation.clearWatch(rec.watchId);activeWatch=null;
  if(rec.points.length<2){toast('Pas assez de points GPS enregistrés pour créer une ascension.');return}
  PENDING={track:rec.points};location.hash='#/creer'}};

views.creer=async()=>{
 const st={track:null,st:null,photos:[]};
 app.innerHTML=`<div class="section"><div class="sh"><h2>Créer une ascension</h2></div><div id="er"></div>
 <label>Nom du sommet *</label><input id="n" maxlength="100"><div class="grid2"><div><label>Localisation</label><input id="loc" maxlength="100"></div><div><label>Massif</label><input id="ma" maxlength="80"></div></div>
 <div class="grid3"><div><label>Type</label><select id="ty">${['Randonnée','Trail','Trek','Alpinisme','Escalade','Ski de randonnée','Autre'].map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div><label>Région</label><select id="rg">${['Alpes','Pyrénées','Jura','Vosges','Massif central','Corse','Autre'].map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div><label>Date</label><input type="date" id="dt" value="${new Date().toISOString().slice(0,10)}"></div></div>
 <div class="grid2"><div><label>Heure de départ</label><input type="time" id="h0"></div><div><label>Heure d’arrivée</label><input type="time" id="h1"></div></div>
 <label>Description</label><textarea id="ds" rows="3" maxlength="1000"></textarea>
 <label>Parcours : importer un GPX</label><input type="file" id="gpx" accept=".gpx"><div id="gs" class="ro"></div>
 <button class="btn sm" id="rec0" type="button" style="margin-bottom:8px">🎯 Enregistrer maintenant (GPS)</button>
 <div class="grid3"><div><label>Altitude max (m)</label><input type="number" id="alt"></div><div><label>Distance (km)</label><input type="number" step="0.1" id="dist"></div><div><label>D+ (m)</label><input type="number" id="dp"></div>
 <div><label>D- (m)</label><input type="number" id="dm"></div><div><label>Durée (min)</label><input type="number" id="du"></div><div><label>Difficulté</label><select id="df"><option>Facile</option><option>Moyen</option><option>Difficile</option><option>Expert</option></select></div></div>
 <label>Photos (galerie ou appareil photo)</label><input type="file" id="ph" accept="image/*" multiple><div class="pv" id="pv"></div>
 <p class="ro">📍 = position GPS détectée automatiquement (EXIF). Sans GPS, positionne la photo manuellement sur le tracé une fois le GPX importé.</p>
 <div class="acts"><button class="btn rust" id="go">Publier l’ascension</button></div></div>`;
 $('#rec0').onclick=()=>location.hash='#/enregistrer';
 if(PENDING){const P=PENDING;PENDING=null;
  if(P.summit){const s=P.summit;$('#n').value=s.name;if(s.ele)$('#alt').value=s.ele;$('#loc').value=`${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}`}
  if(P.track){const pts=P.track,s=computeStats(pts);st.track=pts;st.st=s;
   $('#dist').value=s.dist.toFixed(1);$('#dp').value=s.dplus;$('#dm').value=s.dminus;if(s.max!=null)$('#alt').value=s.max;if(s.duration)$('#du').value=s.duration;
   $('#gs').textContent=`✓ Tracé importé : ${pts.length} points · ${fmt(s.dist,2)} km`+(s.dplus?` · +${s.dplus} m`:'')+(s.max==null?' (sans données d’altitude — complète-les manuellement ou importe un GPX)':'')}}
 const er=m=>{$('#er').innerHTML=m?`<div class="err">${esc(m)}</div>`:''};
 $('#gpx').onchange=async e=>{const f=e.target.files[0];if(!f)return;er('');
  try{if(!/\.gpx$/i.test(f.name))throw new Error('Extension non supportée : .gpx attendu.');if(f.size>LIMITS.gpx)throw new Error('Fichier GPX trop volumineux (max 15 Mo).');
   const pts=parseGPX(await f.text()),s=computeStats(pts);st.track=pts;st.st=s;
   $('#dist').value=s.dist.toFixed(1);$('#dp').value=s.dplus;$('#dm').value=s.dminus;if(s.max!=null)$('#alt').value=s.max;if(s.duration)$('#du').value=s.duration;
   $('#gs').textContent=`✓ ${pts.length} points · ${fmt(s.dist,2)} km · +${s.dplus} m / -${s.dminus} m`+(s.min!=null?` · ${s.min}–${s.max} m`:'')}
  catch(x){st.track=null;st.st=null;er('GPX invalide : '+x.message)}};
 const pv=()=>{$('#pv').innerHTML=st.photos.map((p,i)=>`<div><img src="${p.src}" alt="">${i===0?'<small style="position:absolute;bottom:2px;left:4px">★</small>':''}${p.lat!=null?'<small style="position:absolute;top:2px;left:4px">📍</small>':''}<button data-i="${i}" data-act="del">✕</button></div>`).join('')
  +(st.track?'<div style="width:100%;margin-top:8px">'+st.photos.map((p,i)=>p.lat==null?`<button class="btn sm" data-pos="${i}" style="margin:0 6px 6px 0">Positionner « ${esc(p.name.slice(0,16))} »</button>`:'').join('')+'</div>':'')};
 $('#ph').onchange=async e=>{er('');for(const f of e.target.files){try{st.photos.push(await readPhoto(f))}catch(x){er(x.message)}}pv();e.target.value=''};
 $('#pv').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='del'){st.photos.splice(+b.dataset.i,1);pv();return}
  if(b.dataset.pos!=null){const i=+b.dataset.pos;openPositionModal(st.track,st.photos[i],pt=>{st.photos[i].lat=pt.lat;st.photos[i].lon=pt.lon;st.photos[i].ele=pt.ele;st.photos[i].manual=true;pv()})}};
 $('#go').onclick=async()=>{const n=$('#n').value.trim();if(!n)return er('Le nom du sommet est obligatoire.');
  const s=st.st||{},num=id=>+$(id).value||0,h0=$('#h0').value;
  const a={id:crypto.randomUUID(),name:n,location:$('#loc').value.trim(),massif:$('#ma').value.trim(),type:$('#ty').value,region:$('#rg').value,date:$('#dt').value,description:$('#ds').value.trim(),
   alt:num('#alt'),dist:num('#dist'),dplus:num('#dp'),dminus:num('#dm'),duration:num('#du')||null,difficulty:$('#df').value,startHour:h0?+h0.slice(0,2):(s.startHour??null),
   track:st.track?st.track:null,cum:s.cum||null,photos:st.photos,comments:[],likedBy:[],savedBy:[],likes:0,user:ME.name,uid:ME.id};
  try{await repo.save(a);L_all=await load();location.hash='#/ascension/'+a.id}catch(x){er('Sauvegarde impossible (stockage plein ?) : '+x.message)}}};

views.ascension=async id=>{
 const a=L_all.find(x=>x.id===id);if(!a){app.innerHTML='<div class="section"><div class="empty">Ascension introuvable.</div></div>';return}
 const liked=a.likedBy.includes(ME.id),saved=a.savedBy.includes(ME.id);
 if(a.track&&!a.cum)a.cum=computeStats(a.track).cum;
 app.innerHTML=`<div class="section"><div class="cover" style="${cover(a)}"><h2>${esc(a.name)}</h2></div>
 <div class="meta" style="margin-bottom:14px"><span>${esc(a.user)}</span><span>${esc(a.date)}</span><span>${esc(a.type)}</span><span>${esc(a.massif||a.region||'')}</span>${a.demo?'<span>(Données de démonstration)</span>':''}</div>
 <div class="strip five"><div class="sp"><b>${fmt(a.dist,1)} km</b><span>distance</span></div><div class="sp"><b>+${fmt(a.dplus)} m</b><span>D+</span></div><div class="sp"><b>-${fmt(a.dminus)} m</b><span>D-</span></div><div class="sp"><b>${a.duration?Math.floor(a.duration/60)+' h '+String(a.duration%60).padStart(2,'0'):'—'}</b><span>durée</span></div><div class="sp"><b>${fmt(a.alt)} m</b><span>altitude max</span></div></div>
 <div class="acts"><button class="btn" id="lk">♥ ${a.likedBy.length+(a.likes||0)}${liked?' (aimé)':''}</button><button class="btn" id="sv">🔖 ${saved?'Enregistrée':'Enregistrer'}</button><button class="btn" id="sh">Partager</button><button class="btn" id="d3">Voir en 3D 🏔️</button><button class="btn" id="ex">Exporter GPX</button>${a.uid===ME.id?'<button class="btn" id="dl">Supprimer</button>':''}</div>
 <div class="sh"><h2>Tracé</h2></div>${a.track?'<div class="map" id="map"></div><div class="sh" style="margin-top:20px"><h3>Profil d’altitude</h3></div><div id="pf"></div>':'<div class="empty">Aucun parcours GPX pour cette ascension.</div>'}
 <div class="sh"><h2>Photos</h2></div>${a.photos?.length?`<div class="gal">${a.photos.map((p,i)=>`<img src="${p.src}" alt="" data-g="${i}">`).join('')}</div>`:'<div class="empty">Aucune photo.</div>'}
 ${a.track?`<div class="sh"><h2>Chronologie</h2></div>${timelineHTML(a)}`:''}
 <div class="sh"><h2>Description</h2></div><p style="color:var(--fog);max-width:65ch">${esc(a.description)||'Pas de description.'}</p>
 <div class="sh"><h2>Commentaires (${a.comments.length})</h2></div><div id="cs"></div><div style="display:flex;gap:8px;margin-top:12px"><input id="ci" maxlength="300" placeholder="Écrire un commentaire…"><button class="btn rust" id="cp">Publier</button></div></div>`;
 if(a.track){const m=makeMap($('#map'));if(m){drawTrack(m,a);profile($('#pf'),a,m);
  (a.photos||[]).filter(p=>p.lat!=null).forEach(p=>{const d=photoDist(a,p);
   const mk=L.marker([p.lat,p.lon],{icon:L.divIcon({html:`<div style="width:34px;height:34px;border-radius:50%;border:2px solid #D9852E;background:url('${p.src}') center/cover"></div>`,iconSize:[34,34]})}).addTo(m);
   mk.bindPopup(`<b>${esc(p.name||'Photo')}</b>${p.ele!=null?'<br>'+fmt(p.ele)+' m':''}${d!=null?' · '+fmt(d/1000,2)+' km depuis le départ':''}`)})}}
 const cs=()=>$('#cs').innerHTML=a.comments.length?a.comments.map(c=>`<div class="cm"><span><b>${esc(c.user)}</b> <small>${esc(c.date)}</small><br>${esc(c.text)}</span>${c.uid===ME.id?`<button class="lk" data-c="${esc(c.id)}">Supprimer</button>`:''}</div>`).join(''):'<div class="empty">Aucun commentaire.</div>';cs();
 const persist=async()=>{await repo.save(a);L_all=await load()};
 $('#lk').onclick=async()=>{await toggle(a.id,'likedBy');L_all=await load();route()};
 $('#sv').onclick=async()=>{await toggle(a.id,'savedBy');L_all=await load();route()};
 $('#cp').onclick=async()=>{const t=$('#ci').value.trim();if(!t)return;a.comments.push({id:crypto.randomUUID(),uid:ME.id,user:ME.name,text:t,date:new Date().toLocaleDateString('fr-FR')});await persist();route()};
 $('#cs').onclick=async e=>{const b=e.target.closest('[data-c]');if(!b)return;a.comments=a.comments.filter(c=>c.id!==b.dataset.c);await persist();route()};
 $('#sh').onclick=async()=>{const url=location.origin+location.pathname+'#/ascension/'+a.id;
  try{if(navigator.share)await navigator.share({title:a.name,url});else{await navigator.clipboard.writeText(url);toast('Lien copié.')}}catch{}};
 $('#ex').onclick=()=>downloadGPX(a);$('#d3').onclick=()=>open3D(a);
 $('#dl')&&($('#dl').onclick=async()=>{if(confirm('Supprimer cette ascension ?')){await repo.remove(a.id);L_all=await load();location.hash='#/profil'}});
 app.querySelectorAll('[data-g]').forEach(i=>i.onclick=()=>{let k=+i.dataset.g;const show=()=>openOv(`<div style="text-align:center"><img src="${a.photos[k].src}" alt=""><div style="margin-top:10px"><button class="btn sm" id="pv0">‹</button> ${k+1}/${a.photos.length} <button class="btn sm" id="nx0">›</button></div></div>`);
  show();$('#ovc').onclick=e=>{if(e.target.id==='pv0'){k=(k-1+a.photos.length)%a.photos.length;show()}if(e.target.id==='nx0'){k=(k+1)%a.photos.length;show()}}})};

/* ============ Router ============ */
const NAV=[['','Accueil'],['explorer','Explorer'],['communaute','Communauté'],['carte','Carte'],['profil','Profil']];
async function route(){
 if(mapInst){mapInst.remove();mapInst=null}closeOv();
 if(activeWatch){navigator.geolocation.clearWatch(activeWatch);activeWatch=null;toast('Enregistrement GPS interrompu (page quittée).')}
 const parts=(location.hash.replace(/^#\/?/,'')||'').split('/');const v=parts[0]||'accueil';
 $('#links').innerHTML=NAV.map(([h,l])=>`<a href="#/${h}" class="${(parts[0]||'')===h?'on':''}">${l}</a>`).join('');
 document.querySelectorAll('.bn a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')===`#/${parts[0]||''}`));
 try{L_all=await load();await (views[v]||views.accueil)(parts[1]);window.scrollTo(0,0)}
 catch(e){app.innerHTML=`<div class="section"><div class="err">Erreur : ${esc(e.message)}. IndexedDB est peut-être désactivé (navigation privée).</div></div>`}}
addEventListener('hashchange',route);route();
</script>
